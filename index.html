<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Supriya ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, sans-serif;
  background:#120b16;
  color:white;
  overflow-x:hidden;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 20px;
  position:relative;
  overflow:hidden;
}

.hidden{
  display:none !important;
}

/* Floating hearts */
.heart{
  position:fixed;
  bottom:-30px;
  font-size:22px;
  pointer-events:none;
  animation:floatUp linear forwards;
  z-index:50;
  opacity:.85;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
  }
  15%{opacity:1;}
  100%{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}

/* First screen */
#intro{
  background:
    radial-gradient(circle at 50% 30%,#63294e 0%,#241326 38%,#120b16 75%);
}

.intro-box{
  max-width:650px;
  animation:fadeIn 1.5s ease;
}

.small{
  font-size:15px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#ffb6d9;
  margin-bottom:22px;
}

h1{
  font-size:clamp(42px,12vw,85px);
  line-height:1;
  margin-bottom:20px;
}

.name{
  color:#ff8fc8;
  text-shadow:0 0 25px rgba(255,143,200,.45);
}

.subtitle{
  font-size:19px;
  line-height:1.7;
  color:#eadce7;
  margin:0 auto 35px;
  max-width:530px;
}

.btn{
  border:none;
  padding:16px 30px;
  border-radius:50px;
  background:linear-gradient(135deg,#ff5fa8,#ff8ac5);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(255,80,160,.25);
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);
}

.btn:active{
  transform:scale(.97);
}

/* Birthday */
#birthday{
  background:
    radial-gradient(circle at top,#702d57,#261328 45%,#100911);
  min-height:100vh;
  flex-direction:column;
}

.birthday-content{
  max-width:750px;
}

.birthday-title{
  font-size:clamp(45px,11vw,90px);
  margin-bottom:10px;
}

.birthday-title span{
  color:#ff9dcc;
}

.cake{
  font-size:75px;
  margin:15px 0;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.message{
  font-size:19px;
  line-height:1.8;
  color:#f5e9f1;
  margin:20px auto 35px;
  max-width:650px;
}

.message strong{
  color:#ff9dcc;
}

/* Love screen */
#love{
  background:#0f0912;
  flex-direction:column;
}

.love-card{
  max-width:700px;
  padding:20px;
}

.love-title{
  font-size:clamp(55px,14vw,110px);
  color:#ff6baa;
  text-shadow:0 0 30px rgba(255,80,160,.4);
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}

.love-text{
  font-size:20px;
  line-height:1.9;
  color:#eadce7;
  margin:25px auto 35px;
}

/* Gallery */
#gallery{
  background:
    linear-gradient(#160c18,#0e0911);
  flex-direction:column;
  padding-top:70px;
  padding-bottom:70px;
}

.gallery-title{
  font-size:clamp(35px,9vw,60px);
  margin-bottom:12px;
}

.gallery-subtitle{
  color:#cdbdcc;
  margin-bottom:35px;
  font-size:16px;
}

.gallery{
  width:100%;
  max-width:950px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.photo{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  background:#241525;
  aspect-ratio:3/4;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.5s;
}

.photo:hover img{
  transform:scale(1.06);
}

.photo-number{
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
}

/* Final */
#final{
  min-height:100vh;
  background:
    radial-gradient(circle at center,#66274f,#1b0d20 50%,#09060b);
  flex-direction:column;
}

.final-title{
  font-size:clamp(40px,10vw,75px);
  margin-bottom:25px;
}

.final-message{
  max-width:650px;
  font-size:20px;
  line-height:1.9;
  color:#f1e5ee;
}

.final-message .pink{
  color:#ff8fc8;
  font-weight:bold;
}

.signature{
  margin-top:35px;
  color:#cdbdcc;
  font-size:15px;
  letter-spacing:2px;
}

/* Countdown */
.countdown{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.time-box{
  min-width:75px;
  padding:12px 8px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

.time-box b{
  display:block;
  font-size:25px;
  color:#ff9dcc;
}

.time-box span{
  font-size:11px;
  color:#cdbdcc;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(25px);}
  to{opacity:1;transform:translateY(0);}
}

.reveal{
  animation:fadeIn 1s ease;
}

/* Desktop */
@media(min-width:700px){
  .gallery{
    grid-template-columns:repeat(3,1fr);
  }
}

/* Mobile */
@media(max-width:500px){
  .page{
    padding:25px 15px;
  }

  .subtitle{
    font-size:17px;
  }

  .message,
  .love-text,
  .final-message{
    font-size:17px;
  }

  .gallery{
    gap:10px;
  }

  .photo{
    border-radius:13
